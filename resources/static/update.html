<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student Details</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div id="first-heading">
            <h1>My Student Management System</h1>
    </div>
    <br><br><hr>
    <div style="font-size: x-large;">
    We need to update the student Details 
    </div><br><br>
    <form onsubmit="updateStudent(event)">
    
		
		Roll-Number: <input type="number" id="roll-no" required autofocus placeholder="01"> <br><br>
		    Full Name: <input type="text" id="name" autofocus required placeholder="First Name"><br><br>
		    Last Name: <input type="text" id="lname"  autofocus required placeholder="Last Name"><br><br>
		    Age: <input type="number" id="age"  autofocus required placeholder="Age"><br><br>
		    <button type="submit">Submit</button>
    </form>
    <br><br><br>
    <div>
        <button >
            <a href="home.html"> Home Page </a>
        </button>
    </div>
	<script src="script.js"></script>
</body>
</html>
